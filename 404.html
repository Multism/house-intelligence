<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — House Intelligence</title>
<meta name="theme-color" content="#0d0c0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%23111%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%23d4ff3a%22/%3E%3C/svg%3E">
<style>
  :root { --bg:#0d0c0b; --ink:#efe9dd; --ink2:#b4ab9c; --ink3:#948c7f; --accent:#d4ff3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center; padding: 24px; text-align: center;
    font: 15px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    background-image: radial-gradient(900px 480px at 50% -160px, rgba(212,255,58,.10), transparent 70%);
  }
  .wrap { max-width: 560px; }
  .brand { font: 700 20px/1 ui-monospace, Menlo, monospace; letter-spacing: .04em; margin-bottom: 48px; }
  .brand span { color: #ff6b35; }
  .code { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em; color: var(--ink3); }
  h1 { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(34px, 8vw, 52px); line-height: 1.02; margin: 14px 0 16px; }
  p { color: var(--ink2); margin: 0 auto 28px; max-width: 40ch; }
  a.btn {
    display: inline-block; padding: 13px 20px; border-radius: 10px;
    background: var(--accent); color: #111; font-weight: 700; text-decoration: none;
  }
  a.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .alt { display: block; margin-top: 18px; font: 12px ui-monospace, Menlo, monospace; color: var(--ink3); }
  .alt a { color: var(--ink2); }
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">HOUSE<span>/</span>INTELLIGENCE</div>
    <div class="code">ERREUR 404</div>
    <h1>Cette station n'existe pas.</h1>
    <p>Le plan a peut-être changé, ou la ligne a été renommée. Reprenez depuis le début : le métro vous y attend.</p>
    <a class="btn" href="/">Retour au plan du métro</a>
    <span class="alt">ou <a href="/#booth">ouvrir The Booth</a> · <a href="/#bibliotheque">la Bibliothèque</a></span>
  </main>
</body>
</html>
